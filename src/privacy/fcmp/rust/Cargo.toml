[package]
name = "wattx-fcmp"
version = "0.2.0"
edition = "2021"
description = "FCMP++ (Full-Chain Membership Proofs) FFI library for WATTx"
license = "MIT"
authors = ["WATTx Core Developers"]

[lib]
name = "wattx_fcmp"
crate-type = ["staticlib", "cdylib"]

[dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1.5", features = ["zeroize_derive"] }
blake2 = "0.10"
subtle = "2"
ff = { version = "0.13", features = ["bits"] }
group = "0.13"
curve25519-dalek = { version = "4", features = ["digest", "rand_core"] }
libc = "0.2"

# Real FCMP++ library (full-chain-membership-proofs via monero-fcmp-plus-plus)
monero-fcmp-plus-plus = { path = "../../../../../fcmp-research/fcmp-plus-plus/networks/monero/ringct/fcmp++" }
dalek-ff-group          = { path = "../../../../../fcmp-research/fcmp-plus-plus/crypto/dalek-ff-group" }
ciphersuite             = { path = "../../../../../fcmp-research/fcmp-plus-plus/crypto/ciphersuite", features = ["ed25519", "helioselene"] }
ec-divisors             = { path = "../../../../../fcmp-research/fcmp-plus-plus/crypto/divisors", features = ["ed25519"] }
multiexp                = { path = "../../../../../fcmp-research/fcmp-plus-plus/crypto/multiexp" }
generalized-bulletproofs = { path = "../../../../../fcmp-research/fcmp-plus-plus/crypto/generalized-bulletproofs" }
monero-generators       = { path = "../../../../../fcmp-research/fcmp-plus-plus/networks/monero/generators" }

[build-dependencies]
cbindgen = "0.26"

[patch.crates-io]
# Required by the fcmp-plus-plus workspace
lazy_static = { git = "https://github.com/rust-lang-nursery/lazy-static.rs", rev = "5735630d46572f1e5377c8f2ba0f79d18f53b10c" }
crypto-bigint = { git = "https://github.com/kayabaNerve/crypto-bigint", branch = "c-repr" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
